# Job Radar: sources and filters. No secrets here.

home:
  city: Milan
  lat: 45.4642
  lon: 9.1900

geo:
  on_site_max_km: 50
  hybrid_max_km: 100
  # Exceptions: hybrid roles inside these areas are accepted even beyond hybrid_max_km.
  hybrid_extra_areas:
    - { name: Turin, lat: 45.0703, lon: 7.6869, radius_km: 20 }
  local_countries: [it, sm]       # ISO2 codes accepted for on-site/hybrid work

max_age_days: 30
queue_dir: data/queue
description_max_chars: 4000
user_agent: "JobRadar/2.0 (personal job search, low volume)"

excel:
  path: output/jobs.xlsx          # the working file
  mirror: null                    # optional second copy (for example a synced folder); null = off

# Search keywords for sources that support text search
queries:
  - revenue operations
  - revops
  - sales operations
  - gtm engineer
  - go-to-market operations
  - crm
  - hubspot
  - sales analyst
  - business intelligence
  - marketing operations
  - marketing automation

# Only sources with a public API or RSS feed are enabled by default.
# Sources marked "verify" read HTML pages or use aggregator endpoints: check each site's terms
# of use and robots.txt before enabling them for yourself.
sources:
  weworkremotely:
    enabled: true                 # public RSS feeds
    categories:
      - remote-sales-and-marketing-jobs
      - remote-management-and-finance-jobs
  himalayas:
    enabled: true                 # public JSON API
  jobicy:
    enabled: true                 # public JSON API (attribute the source: the original link is always kept)
    tags: [revops, revenue operations, sales operations, crm, hubspot, marketing operations, business intelligence]
  workingnomads:
    enabled: true                 # public JSON endpoint
  freehire:
    enabled: false                # verify: aggregator API terms
    base_url: https://freehire.me/api/v1/agent/jobs/search
    page_size: 50
    local_companies: []
  randstad:
    enabled: false                # verify: HTML pages, robots.txt allows /offerte-lavoro/ at the time of writing
    locations: [milano, monza, bergamo, como]
    queries: [crm, sales-analyst, business-analyst, marketing, data-analyst]
    max_details_per_run: 40
  eudatajobs:
    enabled: false                # verify: HTML parsing

# Email alerts (LinkedIn job alerts exported as .eml/.html). No network access, no LinkedIn pages.
email_alerts:
  enabled: true
  directory: data/alerts

# Cities with coordinates (great-circle distance from home is computed at runtime).
# A city that is missing here can be resolved by an optional geocoder object (see docs/architecture.md).
gazetteer:
  milan: [45.4642, 9.1900]
  monza: [45.5845, 9.2744]
  bergamo: [45.6983, 9.6773]
  como: [45.8081, 9.0852]
  lecco: [45.8566, 9.3977]
  varese: [45.8206, 8.8251]
  pavia: [45.1847, 9.1582]
  lodi: [45.3142, 9.5037]
  novara: [45.4469, 8.6220]
  brescia: [45.5416, 10.2118]
  turin: [45.0703, 7.6869]
  verona: [45.4384, 10.9916]
  bologna: [44.4949, 11.3426]
  genoa: [44.4056, 8.9463]
  rome: [41.9028, 12.4964]
